security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"
    role_hierarchy:
        ROLE_ADMIN: [ROLE_EMPLOYE, ROLE_CLIENT]
        ROLE_EMPLOYE: ROLE_CLIENT

    providers:
        app_user_provider:
            { entity: { class: App\Entity\User, property: email } }
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Security\LoginSuccessHandler
            logout:
                path: app_logout
                # where to redirect after logout
                target: app_home

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/period, roles: ROLE_ADMIN }
        - { path: ^/rate, roles: ROLE_ADMIN }
        - { path: ^/room, roles: ROLE_ADMIN }
        - { path: ^/picture, roles: ROLE_ADMIN }
        - { path: ^/service, roles: ROLE_ADMIN }
        - { path: ^/user, roles: ROLE_EMPLOYE }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
